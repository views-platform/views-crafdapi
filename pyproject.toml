[project]
name = "views-crafdapi"
version = "0.6.1"
description = ""
authors = [
    {name = "Dylan Pinheiro", email = "52908667+smellycloud@users.noreply.github.com"},
    {name = "Sonja Häffner"},
    {name = "Simon Polichinel von der Maase", email = "simmaa@prio.org"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.136.3",
    # Security floor for the transitive starlette dep (fastapi only requires
    # >=0.46.0, which would otherwise keep an older vulnerable version pinned).
    # Patched: CVE-2025-62727, CVE-2026-48710, CVE-2026-48817/48818 (<1.1.0),
    # CVE-2026-54282 (<1.3.0), CVE-2026-54283 (<1.3.1).
    "starlette>=1.3.1,<2",
    "uvicorn==0.37.0",
    "appwrite==19.2.0",
    "dotenv==0.9.9",
    "pyprojroot==0.3.0",
    "pandas==2.3.3",
    "numpy==2.3.4",
    "pyarrow==23.0.1",
    "cachetools==6.2.1",
    # C-271: imported directly by src/ and previously present only as a transitive of
    # `wandb`, which was removed 2026-08-23. `yaml` is on the production boot path
    # (LoggingModule._setup_logging), `requests` is imported by the package __init__ via
    # client.py, and `pydantic` normalizes every Appwrite SDK response in sdk_compat.
    "PyYAML>=6.0,<7",
    "requests>=2.32,<3",
    "pydantic>=2.9,<3",
    "filelock>=3.20.3",
    # Runtime: the validated MAP/HDI estimator (tower_point/hdi_tower) + frame transport.
    "views-frames>=1.10.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Notebooks are exploratory dev artifacts and are not part of the linted
# surface (CI lints src/ and tests/ only — see risk register C-34).
# `_siblings/` holds other repos checked out in CI (views-appwrite, for the ADR-017
# seam-contract binding test) — never our code, so never our lint surface.
extend-exclude = ["notebooks", "_siblings"]

[tool.hatch.build.targets.wheel]
packages = ["src/views_crafdapi"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.pytest.ini_options]
markers = [
    "integration: requires real Appwrite credentials (APPWRITE_* env vars)",
    "layer1_storage: Layer 1 — Storage I/O integration tests",
    "layer2_data: Layer 2 — Data processing, aggregation, statistics",
    "layer3_http: Layer 3 — HTTP API contract tests",
    "layer4_infra: Layer 4 — Infrastructure, SDK, cache, deployment",
    "layer5_audit: Layer 5 — Falsification, regression, coverage tracking",
    "requires_sibling_repos(*repos): skip unless the named sibling repo directories exist under PLATFORM_ROOT (cross-repo falsification probes — see TESTING.md, register C-74)",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["src/views_crafdapi"]
branch = true
omit = [
    "*/tests/*",
    "*/notebooks/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
# No fail_under gate — baseline only, by design (epic #125 / TESTING.md):
# a coverage gate would recreate the red-by-default trap C-74/C-76 warn against.

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "httpx>=0.27,<1",
    "matplotlib>=3.10.9",
    "geopandas>=1.1.3",
    "ipykernel>=7.2.0",
    "pytest-cov>=7.1.0",
    "nbmake>=1.5.5",
]
